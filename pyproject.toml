[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "en-masse-agents"
version = "0.0.1"
description = "Prototype simulator for exploring conservative-to-optimistic synchronization policies for multi-agent execution"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
experiments = ["matplotlib>=3.7"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["enmasse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
