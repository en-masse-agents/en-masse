[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "en-masse"
version = "0.0.1"
description = "Exploring conservative-to-optimistic synchronization policies for multi-agent LLM execution (prototype simulation engine, policies and checker)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Neha Karanjkar" }]
keywords = ["multi-agent systems", "synchronization", "PDES", "speculative execution", "simulation"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
experiments = ["matplotlib>=3.7"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/en-masse-agents/en-masse"
Repository = "https://github.com/en-masse-agents/en-masse"
Issues = "https://github.com/en-masse-agents/en-masse/issues"

[tool.setuptools.packages.find]
include = ["enmasse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
